apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: ai-agent
  labels:
    app: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      serviceAccountName: wren
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 0
      initContainers:
        # Render the ConfigMap template (with ${MATRIX_ACCESS_TOKEN} etc.) into the
        # persistent hermes home, then chown everything to uid 10000 (the hermes user).
        # Also seeds custom plugins and skills from /opt/hermes/wren/ (baked into the
        # image by Dockerfile.hermes-agent). Both steps are idempotent and fast on PVC.
        - name: render-config
          image: ghcr.io/marcleibold/hermes-agent:matrix
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /opt/data/platforms/matrix/store /opt/data/workspace
              cp /config-template/config.yaml /opt/data/config.yaml
              cp /config-template/AGENTS.md /opt/data/workspace/AGENTS.md
              # Harness files (only overwrite if not already present locally,
              # so user edits inside the pod survive pod restarts)
              for f in IDENTITY.md USER.md MEMORY.md TOOLS.md; do
                if [ ! -f "/opt/data/$f" ] || [ -z "$(cat /opt/data/$f 2>/dev/null)" ]; then
                  cp "/config-template/$f" "/opt/data/$f"
                fi
              done
              # Custom plugins and skills (always seed; user edits not expected
              # here, and we want the version-controlled copy to be canonical).
              for d in /opt/hermes/wren/plugins/*/; do
                [ -d "$d" ] || continue
                name=$(basename "$d")
                mkdir -p "/opt/data/plugins/$name"
                cp -r "$d". "/opt/data/plugins/$name/"
              done
              for d in /opt/hermes/wren/skills/*/; do
                [ -d "$d" ] || continue
                name=$(basename "$d")
                mkdir -p "/opt/data/skills/$name"
                cp -r "$d". "/opt/data/skills/$name/"
              done
              python3 -c '
              import os, pathlib
              p = pathlib.Path("/opt/data/config.yaml")
              t = p.read_text()
              for k, v in os.environ.items():
                  t = t.replace("${" + k + "}", v)
              p.write_text(t)
              '
              chown -R 10000:10000 /opt/data
          env:
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-agent-secrets
                  key: MATRIX_ACCESS_TOKEN
          volumeMounts:
            - name: hermes-home
              mountPath: /opt/data
            - name: config-template
              mountPath: /config-template
              readOnly: true
      containers:
        - name: gateway
          image: ghcr.io/marcleibold/hermes-agent:matrix
          imagePullPolicy: Always
          command:
            - hermes
            - gateway
            - run
          env:
            - name: HOME
              value: /opt/data
            - name: NODE_ENV
              value: production
            - name: MATRIX_HOMESERVER
              value: https://matrix.leibold.tech
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-agent-secrets
                  key: MATRIX_ACCESS_TOKEN
            - name: MATRIX_ENCRYPTION
              value: "true"
            - name: MINIMAX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-agent-secrets
                  key: MINIMAX_API_KEY
            - name: HERMES_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-agent-secrets
                  key: HERMES_GATEWAY_TOKEN
            - name: GATEWAY_ALLOW_ALL_USERS
              value: "true"
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - kill -0 1
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: hermes-home
              mountPath: /opt/data
            - name: tmp-volume
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - CAP_SYS_ADMIN
                - CAP_NET_ADMIN
                - CAP_SYS_RAWIO
                - CAP_SYS_BOOT
      volumes:
        - name: hermes-home
          persistentVolumeClaim:
            claimName: ai-agent-home-pvc
        - name: config-template
          configMap:
            name: ai-agent
        - name: tmp-volume
          emptyDir: {}