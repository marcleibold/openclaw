---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-pod-manager
  namespace: openclaw
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-pod-manager-binding
  namespace: openclaw
subjects:
- kind: ServiceAccount
  name: default
  namespace: openclaw
roleRef:
  kind: Role
  name: openclaw-pod-manager
  apiGroup: rbac.authorization.k8s.io
