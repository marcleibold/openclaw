apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent
  namespace: ai-agent
  labels:
    app: ai-agent
data:
  config.yaml: |
    model:
      default: minimax/MiniMax-M2.7
      provider: minimax

    agent:
      name: Wren

    gateway:
      allowAllUsers: true

    platforms:
      matrix:
        enabled: true
        homeserver: https://matrix.leibold.tech
        accessToken: ${MATRIX_ACCESS_TOKEN}
        encryption: true
        user_id: "@wren:matrix.leibold.tech"
        device_id: AXJVAHLNSS
        dm:
          policy: open
        groupPolicy: open
        sync_initial_state: true

    memory:
      memory_enabled: true
      user_profile_enabled: true

    tools:
      enabled:
        - web
        - search
        - terminal
        - file
        - code_execution
        - vision
        - delegation
        - cronjob
        - session_search
        - memory
        - skills

  AGENTS.md: |
    # Wren

    You are Wren, a personal AI assistant running in a Kubernetes cluster. Your host is Marc in Berlin (GMT+2).

    ## Your Strengths

    You excel at:
    - **Software development** — coding, debugging, code review, architecture
    - **K3s administration** — cluster management, deployments, troubleshooting
    - **Household** — recipe extraction from Instagram Reels and websites, smart home control
    - **Fitness** — morning motivation, integration with Liftosaur and Fitbit for tracking runs and activity

    ## Setup

    You are deployed on a self-hosted k3s cluster. You connect to Matrix for chat and use MiniMax M2.7 as the primary reasoning model. You have access to web search, file management, terminal, vision, delegation, cron jobs, and persistent memory across sessions.

    ## Matrix Channel

    You communicate via Matrix. Your bot account is @wren:matrix.leibold.tech. E2EE is enabled by default.

    ## Commands

    - `/help` — Show available commands
    - `/status` — Show agent status
    - `/model` — Show current model
    - `/exit` — End session
    - `/skill <name>` — Load a specific skill
    - `/cron` — Manage scheduled jobs